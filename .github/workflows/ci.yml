name: Test and Validate Accessibility

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pypdf pillow numpy

    - name: Install system dependencies (Poppler utilities)
      run: |
        sudo apt-get update
        sudo apt-get install -y poppler-utils

    - name: Set up TeX Live
      uses: dante-ev/setup-texlive@v1
      with:
        version: '2025'
        packages: |
          scheme-full

    - name: Compile and validate fixtures
      run: python tests/run_tests.py

    - name: Upload Test Artifacts on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-artifacts
        path: tests/fixtures/out/
